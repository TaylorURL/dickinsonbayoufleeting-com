<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="A leased dock: bulkhead, bollards and gangway">
  <title>A leased dock: bulkhead, bollards and gangway</title>
  <style>
    /* --hull-900 */  .ground { fill: #07101c; }
    /* --hull-800 */  .sky    { fill: #121e30; }
    /* --hull-850 */  .water  { fill: #0e1828; }
    /* --mist-600 */  .far    { fill: #778294; }
    /* --mist-200 */  .ink    { fill: #c5d2e0; }
    /* --signal-500 */ .mark  { fill: #f0a045; }
    /* --rust-500 */  .tier2  { fill: #ba6c47; }
    .rule        { stroke: #778294; stroke-width: 1; fill: none; }
    .wire        { stroke: #c5d2e0; stroke-width: 1.2; fill: none; }
    .accent-rule { stroke: #f0a045; stroke-width: 1.4; fill: none; }
  </style>
  <rect class="ground" width="320" height="140"/>
  <rect class="sky" width="320" height="82"/>
  <rect class="water" y="82" width="320" height="58"/>
  <rect class="mark" y="81.4" width="320" height="1.2" opacity="0.5"/>
  <g class="far" opacity="0.5">
    <rect x="180" y="76" width="140" height="6"/>
  </g>
  <!-- The bulkhead runs the width of the plate: this is the thing being let. -->
  <rect class="ink" x="0" y="68" width="232" height="14"/>
  <rect class="tier2" x="0" y="66" width="232" height="2.4"/>
  <!-- Pilings, on the bay side, at the spacing a real one is driven to. -->
  <g class="ink">
    <rect x="12" y="82" width="5" height="40"/>
    <rect x="52" y="82" width="5" height="44"/>
    <rect x="92" y="82" width="5" height="38"/>
    <rect x="132" y="82" width="5" height="46"/>
    <rect x="172" y="82" width="5" height="40"/>
    <rect x="212" y="82" width="5" height="44"/>
  </g>
  <!-- Bollards and cleats along the cap. -->
  <g class="ink">
    <rect x="26" y="56" width="8" height="12"/><rect x="24" y="52" width="12" height="4.5"/>
    <rect x="104" y="56" width="8" height="12"/><rect x="102" y="52" width="12" height="4.5"/>
    <rect x="182" y="56" width="8" height="12"/><rect x="180" y="52" width="12" height="4.5"/>
  </g>
  <!-- The gangway down to the landing, and the light that keeps it working. -->
  <path class="ink" d="M232,70 L286,96 L286,101 L232,76 Z"/>
  <rect class="ink" x="278" y="99" width="34" height="5"/>
  <rect class="ink" x="280" y="104" width="4" height="22"/>
  <rect class="ink" x="304" y="104" width="4" height="22"/>
  <rect class="ink" x="62" y="24" width="3" height="32"/>
  <rect class="mark" x="58" y="20" width="11" height="5"/>
  <g class="far" opacity="0.45">
    <rect x="14" y="98" width="26" height="1.4"/>
    <rect x="58" y="110" width="34" height="1.4"/>
    <rect x="118" y="103" width="22" height="1.4"/>
    <rect x="164" y="120" width="40" height="1.4"/>
    <rect x="226" y="106" width="28" height="1.4"/>
    <rect x="268" y="126" width="32" height="1.4"/>
    <rect x="36" y="128" width="30" height="1.4"/>
    <rect x="206" y="93" width="18" height="1.4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="A towboat pushing a loaded barge">
  <title>A towboat pushing a loaded barge</title>
  <style>
    /* --hull-900 */  .ground { fill: #07101c; }
    /* --hull-800 */  .sky    { fill: #121e30; }
    /* --hull-850 */  .water  { fill: #0e1828; }
    /* --mist-600 */  .far    { fill: #778294; }
    /* --mist-200 */  .ink    { fill: #c5d2e0; }
    /* --signal-500 */ .mark  { fill: #f0a045; }
    /* --rust-500 */  .tier2  { fill: #ba6c47; }
    .rule        { stroke: #778294; stroke-width: 1; fill: none; }
    .wire        { stroke: #c5d2e0; stroke-width: 1.2; fill: none; }
    .accent-rule { stroke: #f0a045; stroke-width: 1.4; fill: none; }
  </style>
  <rect class="ground" width="320" height="140"/>
  <rect class="sky" width="320" height="82"/>
  <rect class="water" y="82" width="320" height="58"/>
  <rect class="mark" y="81.4" width="320" height="1.2" opacity="0.5"/>
  <g class="far" opacity="0.5">
    <rect x="0" y="77" width="96" height="5"/>
    <rect x="252" y="75" width="68" height="7"/>
  </g>
  <path class="ink" d="M36.2,84.0 H169.8 L178.0,92.5 L169.8,101.0 H36.2 L28.0,92.5 Z"/>
  <rect class="ink" x="52.0" y="71.8" width="102.0" height="12.2"/>
  <rect class="ground" x="54.0" y="75.2" width="98.0" height="5.8" opacity="0.55"/>
  <!-- The boat is the one on the mark, so the plate and the wordmark are the
       same vessel rather than two guesses at one. -->
  <g transform="translate(167 52) scale(0.14)" class="ink">
    <path fill-rule="evenodd" d="M62,198 C132,180 200,172 258,170 L950,170 C986,170 1006,180 1010,200 L1012,226 C1012,248 1000,266 976,282 C900,326 700,350 440,346 C300,344 190,322 122,286 C88,268 68,234 62,198 Z M118,62 L286,62 L286,80 L272,80 L272,178 L134,178 L134,80 L118,80 Z M196,-110 L208,-110 L208,62 L196,62 Z M168,-98 L236,-98 L236,-87 L168,-87 Z M156,-56 L248,-56 L248,-45 L156,-45 Z M152,94 L178,94 L178,134 L152,134 Z M200,94 L226,94 L226,134 L200,134 Z"/>
  </g>
    <!-- The push: a flat wake off the stern, not a spray. -->
  <g class="mark" opacity="0.6">
    <rect x="296" y="97" width="20" height="1.6"/>
    <rect x="300" y="102" width="16" height="1.6"/>
  </g>
  <g class="far" opacity="0.45">
    <rect x="14" y="98" width="26" height="1.4"/>
    <rect x="58" y="110" width="34" height="1.4"/>
    <rect x="118" y="103" width="22" height="1.4"/>
    <rect x="164" y="120" width="40" height="1.4"/>
    <rect x="226" y="106" width="28" height="1.4"/>
    <rect x="268" y="126" width="32" height="1.4"/>
    <rect x="36" y="128" width="30" height="1.4"/>
    <rect x="206" y="93" width="18" height="1.4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Barges made fast in a fleeting slip">
  <title>Barges made fast in a fleeting slip</title>
  <style>
    /* --hull-900 */  .ground { fill: #07101c; }
    /* --hull-800 */  .sky    { fill: #121e30; }
    /* --hull-850 */  .water  { fill: #0e1828; }
    /* --mist-600 */  .far    { fill: #778294; }
    /* --mist-200 */  .ink    { fill: #c5d2e0; }
    /* --signal-500 */ .mark  { fill: #f0a045; }
    /* --rust-500 */  .tier2  { fill: #ba6c47; }
    .rule        { stroke: #778294; stroke-width: 1; fill: none; }
    .wire        { stroke: #c5d2e0; stroke-width: 1.2; fill: none; }
    .accent-rule { stroke: #f0a045; stroke-width: 1.4; fill: none; }
  </style>
  <rect class="ground" width="320" height="140"/>
  <rect class="sky" width="320" height="82"/>
  <rect class="water" y="82" width="320" height="58"/>
  <rect class="mark" y="81.4" width="320" height="1.2" opacity="0.5"/>
  <!-- Far shore: the treeline across the bay, flat and low so it stays behind. -->
  <g class="far" opacity="0.55">
    <rect x="0" y="74" width="122" height="8"/>
    <rect x="148" y="76" width="76" height="6"/>
    <rect x="242" y="73" width="78" height="9"/>
  </g>
  <!-- The bulkhead the fleet is made fast to. -->
  <rect class="ink" x="0" y="70" width="42" height="12"/>
  <rect class="ink" x="6" y="82" width="4" height="34"/>
  <rect class="ink" x="24" y="82" width="4" height="30"/>
  <g class="ink">
    <rect x="10" y="60" width="7" height="10"/>
    <rect x="8" y="57" width="11" height="4"/>
    <rect x="28" y="62" width="6" height="8"/>
    <rect x="26.5" y="59" width="9" height="4"/>
  </g>
  <path class="ink" d="M56.3,84.0 H125.7 L130.0,91.5 L125.7,99.0 H56.3 L52.0,91.5 Z"/>
  <rect class="ink" x="64.5" y="73.2" width="53.0" height="10.8"/>
  <rect class="ground" x="66.5" y="76.2" width="49.0" height="5.1" opacity="0.55"/>
  <path class="ink" d="M144.5,87.0 H213.5 L218.0,95.0 L213.5,103.0 H144.5 L140.0,95.0 Z"/>
  <rect class="ink" x="149.1" y="75.5" width="55.8" height="11.5"/>
  <rect class="ground" x="151.1" y="78.7" width="51.8" height="5.4" opacity="0.55"/>
  <path class="ink" d="M228.7,82.0 H305.3 L310.0,89.0 L305.3,96.0 H228.7 L224.0,89.0 Z"/>
  <rect class="ink" x="237.8" y="71.9" width="58.5" height="10.1"/>
  <rect class="ground" x="239.8" y="74.7" width="54.5" height="4.8" opacity="0.55"/>
  <!-- The mooring wires, which are the whole of what fleeting is. -->
  <path class="wire" d="M17,60 C32,62 42,74 54,80"/>
  <path class="wire" d="M32,62 C46,66 56,76 62,81"/>
  <path class="accent-rule" d="M126,86 H142"/>
  <path class="accent-rule" d="M214,84 H230"/>
  <g class="far" opacity="0.45">
    <rect x="14" y="98" width="26" height="1.4"/>
    <rect x="58" y="110" width="34" height="1.4"/>
    <rect x="118" y="103" width="22" height="1.4"/>
    <rect x="164" y="120" width="40" height="1.4"/>
    <rect x="226" y="106" width="28" height="1.4"/>
    <rect x="268" y="126" width="32" height="1.4"/>
    <rect x="36" y="128" width="30" height="1.4"/>
    <rect x="206" y="93" width="18" height="1.4"/>
  </g>
</svg>
